version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: pro24_group1_postgres
    environment:
      POSTGRES_DB: pro24_group1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pro24_group1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
