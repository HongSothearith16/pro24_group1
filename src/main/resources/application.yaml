spring:
  application:
    name: pro24_group1
  datasource:
    url: jdbc:postgresql://localhost:5432/pro24_group1
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
jpa:
  open-in-view: false
  hibernate:
    ddl-auto: validate
  show-sql: true


server:
  port: 8081